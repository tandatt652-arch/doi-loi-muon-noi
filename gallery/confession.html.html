<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quà tặng Uyên</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #05050a;
      color: #ffffff;
      font-family: 'Orbitron', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      perspective: 1200px;
      user-select: none;
    }

    /* Nền hạt tương tác */
    #particleCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Lưới ánh sáng nền Cyberpunk */
    .cyber-grid {
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
      background-size: 50px 50px;
      transform: perspective(600px) rotateX(60deg) translateY(150px) scale(2.5);
      transform-origin: center bottom;
      z-index: 0;
      animation: gridMove 15s linear infinite;
    }

    @keyframes gridMove {
      0% { background-position: 0 0; }
      100% { background-position: 0 50px; }
    }

    /* Khung cảnh chính chứa 2 ảnh và chữ ở giữa */
    .scene {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
      padding: 30px;
      transform-style: preserve-3d;
      transition: transform 0.12s ease-out;
      max-width: 95vw;
    }

    /* Khung chứa ảnh photo1.jpg ở 2 bên */
    .photo-frame {
      position: relative;
      width: 220px;
      height: 290px;
      border-radius: 16px;
      padding: 6px;
      background: linear-gradient(135deg, #00f3ff, transparent 40%, transparent 60%, #ff007f);
      box-shadow: 
        0 0 25px rgba(0, 243, 255, 0.35),
        inset 0 0 15px rgba(255, 0, 127, 0.35);
      transform-style: preserve-3d;
      opacity: 0;
      overflow: hidden;
      cursor: pointer;
      transition: box-shadow 0.3s ease, filter 0.3s ease;
    }

    .photo-frame:hover {
      box-shadow: 
        0 0 45px rgba(0, 243, 255, 0.8),
        0 0 80px rgba(255, 0, 127, 0.5);
      filter: brightness(1.15);
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 12px;
      display: block;
    }

    /* Hiệu ứng tia laser quét qua ảnh */
    .photo-frame::after {
      content: "";
      position: absolute;
      top: -100%;
      left: 0;
      width: 100%;
      height: 40%;
      background: linear-gradient(
        to bottom,
        transparent,
        rgba(0, 243, 255, 0.4),
        rgba(255, 255, 255, 0.8),
        transparent
      );
      animation: laserScan 3.5s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes laserScan {
      0% { top: -60%; }
      50% { top: 120%; }
      100% { top: 120%; }
    }

    /* Chuyển động xuất hiện cho 2 khung ảnh */
    .photo-left.show {
      animation: revealLeftPhoto 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards,
                 floatLeft 4s ease-in-out 1.1s infinite alternate;
    }

    .photo-right.show {
      animation: revealRightPhoto 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards,
                 floatRight 4s ease-in-out 1.1s infinite alternate;
    }

    @keyframes revealLeftPhoto {
      0% {
        opacity: 0;
        transform: translateX(-120px) translateZ(-200px) rotateY(45deg) scale(0.6);
        filter: blur(15px) brightness(3);
      }
      100% {
        opacity: 1;
        transform: translateX(0) translateZ(35px) rotateY(18deg) scale(1);
        filter: blur(0) brightness(1);
      }
    }

    @keyframes revealRightPhoto {
      0% {
        opacity: 0;
        transform: translateX(120px) translateZ(-200px) rotateY(-45deg) scale(0.6);
        filter: blur(15px) brightness(3);
      }
      100% {
        opacity: 1;
        transform: translateX(0) translateZ(35px) rotateY(-18deg) scale(1);
        filter: blur(0) brightness(1);
      }
    }

    @keyframes floatLeft {
      0% { transform: translateY(0px) translateZ(35px) rotateY(18deg); }
      100% { transform: translateY(-14px) translateZ(50px) rotateY(12deg); }
    }

    @keyframes floatRight {
      0% { transform: translateY(0px) translateZ(35px) rotateY(-18deg); }
      100% { transform: translateY(-14px) translateZ(50px) rotateY(-12deg); }
    }

    /* Khối chữ trung tâm */
    .text-wrapper {
      text-align: center;
      transform-style: preserve-3d;
      transform: translateZ(60px);
      padding: 0 10px;
    }

    .headline {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 4px;
      font-size: clamp(2.4rem, 5.5vw, 5.2rem);
      font-weight: 900;
      letter-spacing: 6px;
      text-transform: uppercase;
    }

    .char {
      display: inline-block;
      opacity: 0;
      transform: translateY(70px) rotateX(-90deg) scale(0.3);
      transition: transform 0.25s ease, color 0.25s ease;
      cursor: pointer;
      color: #ffffff;
      text-shadow: 
        0 0 10px #00f3ff,
        0 0 25px #00f3ff,
        0 0 50px #0077ff,
        0 6px 0 #09203f;
    }

    .char.space {
      width: 28px;
    }

    .char.active {
      opacity: 1;
      transform: translateY(0) rotateX(0deg) scale(1);
      animation: charGlowPulse 2.5s ease-in-out infinite alternate;
    }

    .char:hover {
      color: #ff007f;
      transform: translateY(-15px) scale(1.25) rotateZ(5deg) !important;
      text-shadow: 
        0 0 15px #ff007f,
        0 0 35px #ff007f,
        0 0 70px #ff0055;
    }

    @keyframes charGlowPulse {
      0% {
        text-shadow: 
          0 0 10px #00f3ff,
          0 0 25px #00f3ff,
          0 0 50px #0077ff,
          0 6px 0 #09203f;
      }
      100% {
        text-shadow: 
          0 0 15px #00f3ff,
          0 0 35px #ff007f,
          0 0 75px #ff007f,
          0 6px 0 #2e093f;
      }
    }

    /* Thanh ánh sáng dưới chữ */
    .energy-bar {
      height: 3px;
      width: 0%;
      margin: 18px auto 12px;
      background: linear-gradient(90deg, transparent, #00f3ff, #ffffff, #ff007f, transparent);
      box-shadow: 0 0 20px #00f3ff;
      transition: width 1.2s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .energy-bar.expand {
      width: 100%;
    }

    .subtitle {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.1rem;
      letter-spacing: 8px;
      color: #8be9fd;
      opacity: 0;
      transform: translateY(15px);
      transition: all 0.8s ease;
    }

    .subtitle.show {
      opacity: 0.85;
      transform: translateY(0);
    }

    /* Nút phát lại hiệu ứng */
    .controls {
      position: fixed;
      bottom: 35px;
      z-index: 20;
    }

    .btn-replay {
      background: rgba(0, 243, 255, 0.08);
      color: #00f3ff;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 3px;
      padding: 12px 28px;
      border: 1px solid rgba(0, 243, 255, 0.5);
      border-radius: 30px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
      transition: all 0.3s ease;
    }

    .btn-replay:hover {
      background: #00f3ff;
      color: #05050a;
      box-shadow: 0 0 30px #00f3ff;
      transform: translateY(-2px);
    }

    /* Đáp ứng màn hình nhỏ / điện thoại */
    @media (max-width: 900px) {
      .scene {
        flex-direction: column;
        gap: 20px;
      }
      .photo-frame {
        width: 150px;
        height: 190px;
      }
    }
  </style>
</head>
<body>

  <div class="cyber-grid"></div>
  <canvas id="particleCanvas"></canvas>

  <div class="scene" id="scene">
    <!-- Ảnh photo1.jpg bên trái -->
    <div class="photo-frame photo-left" id="photoLeft">
      <img src="photo1.jpg" alt="Photo Left" onerror="this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600&auto=format&fit=crop&q=80'">
    </div>

    <!-- Dòng chữ HELLO WORLD ở giữa -->
    <div class="text-wrapper">
      <h1 class="headline" id="headline"></h1>
      <div class="energy-bar" id="energyBar"></div>
      <p class="subtitle" id="subtitle"></p>
    </div>

    <!-- Ảnh photo1.jpg bên phải -->
    <div class="photo-frame photo-right" id="photoRight">
      <img src="photo1.jpg" alt="Photo Right" onerror="this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600&auto=format&fit=crop&q=80'">
    </div>
  </div>

  <div class="controls">
    <button class="btn-replay" onclick="playRevealEffect()">KÍCH HOẠT LẠI HIỆU ỨNG</button>
  </div>

  <script>
    const TEXT = "UYÊN";
    const GLYPHS = "01アイウエオカキクケコ∑∆ΩΨ⚡★#%&@$";
    const headlineEl = document.getElementById("headline");
    const photoLeft = document.getElementById("photoLeft");
    const photoRight = document.getElementById("photoRight");
    const energyBar = document.getElementById("energyBar");
    const subtitle = document.getElementById("subtitle");
    const scene = document.getElementById("scene");

    // 1. Thiết lập hệ thống hạt & pháo hoa năng lượng trên Canva
    const canvas = document.getElementById("particleCanvas");
    const ctx = canvas.getContext("2d");
    let particles = [];
    let shockwaves = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 7 + 1.5;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.size = Math.random() * 3.5 + 1.5;
        this.alpha = 1;
        this.decay = Math.random() * 0.02 + 0.015;
        this.color = color;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vx *= 0.96;
        this.vy *= 0.96;
        this.alpha -= this.decay;
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 12;
        ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    class Shockwave {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.radius = 5;
        this.alpha = 0.9;
        this.color = color;
      }
      update() {
        this.radius += 6;
        this.alpha -= 0.03;
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
    }

    function createExplosion(x, y, count = 28) {
      const colors = ["#00f3ff", "#ff007f", "#ffffff", "#7b2cbf"];
      shockwaves.push(new Shockwave(x, y, colors[Math.floor(Math.random() * 2)]));
      for (let i = 0; i < count; i++) {
        const color = colors[Math.floor(Math.random() * colors.length)];
        particles.push(new Particle(x, y, color));
      }
    }

    function animateCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles = particles.filter(p => p.alpha > 0);
      shockwaves = shockwaves.filter(s => s.alpha > 0);

      shockwaves.forEach(s => { s.update(); s.draw(); });
      particles.forEach(p => { p.update(); p.draw(); });

      requestAnimationFrame(animateCanvas);
    }
    animateCanvas();

    // 2. Hàm chạy hiệu ứng xuất hiện chữ "HELLO WORLD" và 2 tấm ảnh
    let activeTimers = [];

    function playRevealEffect() {
      // Xóa các bộ đếm cũ nếu bấm phát lại liên tục
      activeTimers.forEach(t => clearTimeout(t));
      activeTimers = [];

      // Reset trạng thái giao diện
      headlineEl.innerHTML = "";
      photoLeft.classList.remove("show");
      photoRight.classList.remove("show");
      energyBar.classList.remove("expand");
      subtitle.classList.remove("show");

      // Tạo các thẻ chữ cái
      const chars = TEXT.split("").map((ch) => {
        const span = document.createElement("span");
        span.className = ch === " " ? "char space" : "char";
        span.textContent = ch === " " ? "\u00A0" : GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
        
        // Cho phép click vào từng chữ để nổ pháo hoa hạt
        span.addEventListener("click", (e) => {
          const rect = e.target.getBoundingClientRect();
          createExplosion(rect.left + rect.width / 2, rect.top + rect.height / 2, 40);
        });

        headlineEl.appendChild(span);
        return { el: span, target: ch };
      });

      // Kích hoạt 2 tấm ảnh photo1.jpg bay ra từ 2 bên
      activeTimers.push(setTimeout(() => {
        photoLeft.classList.add("show");
        photoRight.classList.add("show");
        const leftRect = photoLeft.getBoundingClientRect();
        const rightRect = photoRight.getBoundingClientRect();
        createExplosion(leftRect.left + leftRect.width / 2, leftRect.top + leftRect.height / 2, 35);
        createExplosion(rightRect.left + rightRect.width / 2, rightRect.top + rightRect.height / 2, 35);
      }, 150));

      // Giải mã ma trận từng ký tự "HELLO WORLD"
      chars.forEach((item, index) => {
        if (item.target === " ") {
          item.el.classList.add("active");
          return;
        }

        const startDelay = 300 + index * 110;

        activeTimers.push(setTimeout(() => {
          item.el.classList.add("active");
          let scrambleCount = 0;

          const scrambleInterval = setInterval(() => {
            item.el.textContent = GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
            scrambleCount++;

            if (scrambleCount >= 7) {
              clearInterval(scrambleInterval);
              item.el.textContent = item.target;
              const rect = item.el.getBoundingClientRect();
              createExplosion(rect.left + rect.width / 2, rect.top + rect.height / 2, 22);
            }
          }, 40);
        }, startDelay));
      });

      // Kích hoạt thanh năng lượng và phụ đề khi chữ hoàn tất
      const finishTime = 300 + chars.length * 110 + 300;
      activeTimers.push(setTimeout(() => {
        energyBar.classList.add("expand");
        subtitle.classList.add("show");
      }, finishTime));
    }

    // 3. Hiệu ứng nghiêng 3D theo chuyển động chuột
    window.addEventListener("mousemove", (e) => {
      const xAxis = (window.innerWidth / 2 - e.clientX) / 28;
      const yAxis = (window.innerHeight / 2 - e.clientY) / 28;
      scene.style.transform = `rotateY(${-xAxis}deg) rotateX(${yAxis}deg)`;
    });

    // Click vào khung ảnh cũng tạo vụ nổ ánh sáng
    [photoLeft, photoRight].forEach(frame => {
      frame.addEventListener("click", () => {
        const rect = frame.getBoundingClientRect();
        createExplosion(rect.left + rect.width / 2, rect.top + rect.height / 2, 50);
      });
    });

    // Khởi chạy ngay khi mở trang
    window.addEventListener("load", playRevealEffect);
  </script>
</body>
</html>
